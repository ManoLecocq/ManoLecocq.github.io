# Planche 02 · Mes preuves
sous_titre: Quatre types de preuves, chacune vérifiable dans un projet.

types:
  - code: A
    titre: Des résultats testés
    texte: Un cahier de recette avec des tests conformes et non conformes, et des tests écrits pour échouer. Si le contournement du proxy passe, le test est raté.
    affirmations: [non-conformes]
    projets: [sae303]

  - code: B
    titre: Des pannes que j'ai diagnostiquées
    texte: Une config qui marche du premier coup ne prouve pas grand-chose. La méthode pour trouver ce qui bloque, si. Mode debug, lecture des journaux, retour arrière.
    affirmations: [ipsec-dh, radius, retour-arriere]
    projets: [sae303]

  - code: C
    titre: Un regard critique sur notre travail
    texte: Chaque note de synthèse se termine par ses propres limites. Ce qui ne passerait pas à l'échelle, ce qui reste exposé, et par quoi le remplacer.
    affirmations: [limites-303, criticite-401]
    projets: [sae303, sae401]

  - code: D
    titre: Du terrain réel
    texte: Un stage puis une alternance chez Thales, sur une infrastructure qui sert de vrais utilisateurs. Un script que j'ai écrit y tourne en production tous les mois.
    affirmations: [script-thales]
    projets: [thales]
