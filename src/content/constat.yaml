# Planche 01 · Le constat
sous_titre: Une maquette pardonne tout. La production, non.

# Les deux colonnes du tableau comparatif.
comparatif:
  colonnes: [Sur une maquette, En production]
  lignes:
    - ["Les seuls utilisateurs, c'est l'équipe projet.", "De vrais utilisateurs attendent derrière."]
    - ["Le tunnel tombe ? Je relance la VM.", "Le service doit rester disponible."]
    - ["2 boutiques sur la maquette.", "90 boutiques, un parc qui grossit."]
    - ["Les pannes sont celles qu'on provoque.", "Les pannes arrivent sans prévenir."]
    - ["Une erreur se rattrape avec un snapshot.", "Une erreur a des conséquences réelles."]

paragraphes:
  - "Sur un CV d'étudiant en réseau, on lit souvent les mêmes mots : VPN, pare-feu, Active Directory, Linux. Ils ne disent pas si la personne a compris ce qu'elle a configuré ou si elle a suivi un TP pas à pas. Une liste de technos, c'est une affirmation. Ce qui convainc, c'est une preuve."
  - "J'en suis à ce point de bascule : des maquettes d'école d'un côté, une alternance sur une infrastructure de production chez Thales de l'autre. Plutôt que de vous demander de me croire, je vous montre les pièces."

mode_emploi: Sur cette page, certaines phrases sont soulignées. Ce sont des affirmations comme on en lit sur tous les CV. Le bouton **Prouve-le** ouvre la pièce justificative, tirée de mes documents de projet. Voici la première.

affirmation: tests-echec
